# Type check, test, and build on each pull request and on main. The ruleset on main requires the "check" job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # takes the pnpm version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile # pnpm-workspace.yaml allows the better-sqlite3 and esbuild builds
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
